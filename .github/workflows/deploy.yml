# CI에서 빌드한 Docker 이미지를 GCE VM으로 직접 전송하여 배포한다.
# (Artifact Registry를 경유하지 않으므로 GCP 서비스 계정 키가 필요 없다)
#
# 필요한 Secrets
#   GCP_VM_IP        : GCE VM 외부 IP
#   GCP_SSH_USER     : 배포 계정 (linkit_admin)
#   GCP_SSH_PASSWORD : 배포 계정 비밀번호
#   GCP_SSH_PORT     : SSH 포트 (22)
#   그 외 애플리케이션 환경변수 (DB_*, REDIS_*, JWT_*, KAKAO_*, NAVER_*, NCP_* 등)
#
# 폐기된 Secrets (더 이상 참조하지 않음 — 삭제 가능)
#   GCP_SA_KEY, GCP_SSH_KEY, GCP_PROJECT_ID, GCP_REGION, GCP_REPOSITORY
#
# 서버 사전 세팅 (1회, sudo 권한 계정으로 수행)
#   sudo mkdir -p /opt/link-it
#   sudo chown -R linkit_admin:linkit_admin /opt/link-it
#   sudo usermod -aG docker linkit_admin
#   sshd: PasswordAuthentication yes
name: Deploy to GCP

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. JDK 설치 및 빌드
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (skip tests)
        run: ./gradlew clean build -x test

      # 2. Docker 이미지 빌드 및 tar 파일로 저장
      - name: Build Docker Image
        run: |
          docker build -t link-it-backend:latest .
          docker save link-it-backend:latest | gzip > link-it-backend.tar.gz

      # 3. GCE 서버로 이미지 및 docker-compose 파일 전송
      - name: Copy files to GCE
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          password: ${{ secrets.GCP_SSH_PASSWORD }}
          port: ${{ secrets.GCP_SSH_PORT }}
          source: "docker-compose.prod.yml,link-it-backend.tar.gz"
          target: "/opt/link-it"
          overwrite: true

      # 4. GCE 서버에서 배포 실행
      - name: Deploy on GCP Compute Engine
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_SSH_USER }}
          password: ${{ secrets.GCP_SSH_PASSWORD }}
          port: ${{ secrets.GCP_SSH_PORT }}
          script: |
            set -e
            cd /opt/link-it

            # .env 파일 생성
            cat > .env << 'EOF'
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
            JWT_TEMP_EXPIRATION=${{ secrets.JWT_TEMP_EXPIRATION }}
            DEFAULT_PROFILE_IMAGE_URL=${{ secrets.DEFAULT_PROFILE_IMAGE_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            FRONTEND_PROD_URL=${{ secrets.FRONTEND_PROD_URL }}
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            BACKEND_PROD_URL=${{ secrets.BACKEND_PROD_URL }}
            COOKIE_SECURE=${{ secrets.COOKIE_SECURE }}
            COOKIE_SAME_SITE=${{ secrets.COOKIE_SAME_SITE }}
            COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN }}
            NCP_ACCESS_KEY=${{ secrets.NCP_ACCESS_KEY }}
            NCP_SECRET_KEY=${{ secrets.NCP_SECRET_KEY }}
            NCP_BUCKET_NAME=${{ secrets.NCP_BUCKET_NAME }}
            EOF

            # 전송된 Docker 이미지 로드
            gunzip -c link-it-backend.tar.gz | docker load
            rm -f link-it-backend.tar.gz

            # 컨테이너 갱신 및 실행
            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d

            # 미사용 이미지 정리
            docker image prune -f